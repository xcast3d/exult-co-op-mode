name: friend-mode-windows

# Builds Exult with Friend Mode for 64-bit Windows (MSYS2 UCRT64) and uploads
# a ready-to-run folder and its installer (the download, and the update
# WinSparkle installs; docs/friend-mode/updates.md) as run artifacts. Based on ci-windows.yml and
# snapshots-windows.yml, trimmed to Exult.exe only to save Actions minutes.

# Manual only, to save Actions minutes: build at milestones from the Actions
# tab (Run workflow) or with `gh workflow run friend-mode-windows.yml`.
on:
  workflow_dispatch:

# A newer run replaces one still going on the same branch.
concurrency:
  group: friend-mode-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          release: true
          install: |
            base-devel git zip unzip
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-sdl3-image
            mingw-w64-ucrt-x86_64-fluidsynth mingw-w64-ucrt-x86_64-libtimidity
            mingw-w64-ucrt-x86_64-libogg mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-munt-mt32emu mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ca-certificates
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # libdatachannel and Mbed TLS (and their own submodules) for lobby codes.
          submodules: recursive
          # Full history: Quest of the Companions' build number counts the
          # commits since Exult (qotcbuild.h); a shallow clone would make it 0.
          fetch-depth: 0
      # The WebRTC libraries change only with their pinned submodules, the
      # build script or the Mbed TLS settings, so they are cached on those.
      - name: Lobby libraries key
        id: rtc-key
        run: |
          echo "key=friend-rtc-ucrt64-$( (git submodule status --recursive third_party; cat tools/friend-mode/build-rtc.sh tools/friend-mode/mbedtls_friend_config.h) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore lobby libraries
        id: rtc-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/build/windows/lib
            third_party/build/windows/include
          key: ${{ steps.rtc-key.outputs.key }}
      - name: Build lobby libraries
        if: steps.rtc-cache.outputs.cache-hit != 'true'
        env:
          RTC_PREFIX: ${{ github.workspace }}/third_party/build/windows
          CMAKE_GENERATOR: Ninja
        run: tools/friend-mode/build-rtc.sh
      - name: Get WinSparkle
        run: tools/friend-mode/get-winsparkle.sh
      - name: Build Exult
        run: |
          test -f third_party/build/windows/lib/libdatachannel.a
          make -j 4 -f Makefile.mingw U7PATH=out/Exult install
          test -f out/Exult/data/friend/cacert.pem
          test -f out/Exult/WinSparkle.dll
          out/Exult/Exult.exe --version
      - name: Add notes
        run: |
          cp COPYING out/Exult/COPYING.txt
          cp README.windows out/Exult/README.windows.txt
          cp docs/friend-mode/windows-build.md out/Exult/FRIEND-MODE-WINDOWS.md
          cp docs/friend-mode/internet-play.md out/Exult/FRIEND-MODE-INTERNET.md
          git rev-parse HEAD > out/Exult/FRIEND-MODE-COMMIT.txt
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      # Inno Setup 6 comes with GitHub's Windows runners.
      - name: Make installer
        run: |
          version="$(sed -n 's/^#define QOTC_VERSION "\(.*\)"$/\1/p' qotcversion.h)"
          build="$(sed -n 's/^#define QOTC_BUILD //p' qotcbuild.h)"
          test -n "$version" && test "$build" -gt 0
          name="Exult-U7-QOTC-Windows-x64-$SHORT_SHA-setup"
          (cd win32 && "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q \
            "-DSRCDIR=$(cygpath -w ../out/Exult)" "-DQOTC_VERSION=$version" \
            "-DQOTC_BUILD=$build" "-DOUTNAME=$name" qotc_installer.iss)
          mkdir -p setup && mv "win32/$name.exe" setup/
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: exult-friend-mode-windows-${{ env.SHORT_SHA }}
          path: out/
          retention-days: 14
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: exult-friend-mode-windows-setup-${{ env.SHORT_SHA }}
          path: setup/
          retention-days: 14
          if-no-files-found: error
