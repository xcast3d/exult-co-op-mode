# Friend Mode lobby (Cloudflare Worker).  See docs/friend-mode/lobby.md.
name = "u7-multiplayer-lobby"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The lobby's address: a subdomain of the project's own domain, so the
# Worker can move without breaking builds already handed out.
routes = [
	{ pattern = "u7-multiplayer-lobby.xcast3d.com", custom_domain = true },
]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Each internet address's open codes (at most 3 at once).
[[durable_objects.bindings]]
name = "HOSTS"
class_name = "Hosts"

# SQLite-backed Durable Objects work on Workers' free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hosts"]

# Per-address rate limits (Workers Rate Limiting): opening games, and
# joining (which is what someone guessing codes would do).  The period is
# 10 or 60 seconds; namespace_id is any number unique to this account.
[[ratelimits]]
name = "HOST_LIMITER"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "7102"
simple = { limit = 20, period = 60 }

# Optional TURN relay (Cloudflare Calls TURN), as secrets, never in the
# repo or the game:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Without them the lobby hands out STUN only.
