# Friend Mode lobby (Cloudflare Worker).  See docs/friend-mode/lobby.md.
name = "u7-multiplayer-lobby"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The lobby's address: a subdomain of the project's own domain, so the
# Worker can move without breaking builds already handed out.
routes = [
	{ pattern = "u7-multiplayer-lobby.xcast3d.com", custom_domain = true },
	{ pattern = "u7-lobby-admin.xcast3d.com", custom_domain = true },
]

# The admin page (usage counts; src/admin.js) answers only on ADMIN_HOST,
# which Cloudflare Access gates as a whole, like Kitty Launcher's admin.
# Create the Access application for it BEFORE deploying this route.  The
# other two let the Worker check the login Access forwards; neither is a
# secret (the team name is a public hostname, the AUD tag names the Access
# application).  Both are in Zero Trust -> Access -> Applications -> the
# lobby admin app -> Overview.  Empty = the stats answer 503 to everyone.
[vars]
ADMIN_HOST = "u7-lobby-admin.xcast3d.com"
CF_ACCESS_TEAM_DOMAIN = "withered-limit-ab80"
CF_ACCESS_AUD = "58b2c396ae77921d855607843ded4efb90b26c94341a69182c0183d8f1651ca6"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Each internet address's open codes (at most 3 at once).
[[durable_objects.bindings]]
name = "HOSTS"
class_name = "Hosts"

# Usage counts per day (one object for the whole lobby).
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

# SQLite-backed Durable Objects work on Workers' free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hosts"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Stats"]

# Per-address rate limits (Workers Rate Limiting): opening games, and
# joining (which is what someone guessing codes would do).  The period is
# 10 or 60 seconds; namespace_id is any number unique to this account.
[[ratelimits]]
name = "HOST_LIMITER"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "7102"
simple = { limit = 20, period = 60 }

# Optional TURN relay (Cloudflare Calls TURN), as secrets, never in the
# repo or the game:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Without them the lobby hands out STUN only.
